<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <script>
        var x = prompt("whats the weater today?");
        switch (x) {
            case "rain":
                alert("its a rainy day")
                break;
            case "bright":
                alert("its a cloudy day")
                break;
            case "dark":
                alert("its a cloudy day")
                break;
            default:
                alert("please input a value")
                break;
        }
    </script>
</body>
